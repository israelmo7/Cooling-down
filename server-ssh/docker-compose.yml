# Shop computer. Tablets on the shop Wi-Fi call port 8080.
# Midnight uses TZ from shop.json. The default is Asia/Jerusalem.
services:
  server:
    image: cooling-down-server:0.1.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_PATH: /data/cooling_down_server.sqlite
    volumes:
      - ./data:/data
    working_dir: /data
