# Shop computer. Tablets on the shop Wi-Fi call port 8080.
# The report hour and TZ come from shop.json. TZ applies on the next start.
services:
  server:
    image: cooling-down-server:0.1.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_PATH: /data/cooling_down_server.sqlite
    volumes:
      - ./data:/data
    working_dir: /data
